# phDroid 配置，改完重启生效；参数只在 insmod 时读一次
# 各键含义见 README 的配置表

verbose=0
gate=0
mqueue=1
nspid=1
nspid_append=1
skip_sysvipc=0
no_fake_ns=0
skip_do_exit=0
inline_hook=1
write_path=0
degrade=0
selinux_fix=0

# 兼容模块；安装时 auto 已按设备指纹解析成 on/off
compat=auto
ghost=1
ghost_match=oplus_
pid_max_cap=0

# 以下由安装脚本写入，勿手改
kmi=
oplus=0
device_brand=
device_model=

# recovery 刷入时手动指定 KMI，改完要重装
kmi_override=
