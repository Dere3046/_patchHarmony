name: Build GKI

on:
  push:
    paths:
      - 'src/**'
      - 'compat/**'
      - 'Makefile'
      - 'mk/**'
      - 'deps.lst'
      - 'scripts/fetch-deps.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      # one KMI failing must not cancel the rest: the first round of this
      # matrix reported one real failure and five cancels, which reads as
      # five builds that were never tried
      fail-fast: false
      matrix:
        kmi:
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps
        env:
          KMSDK_TOKEN: ${{ secrets.KMSDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${KMSDK_TOKEN}@github.com/".insteadOf "git@github.com:"
          scripts/fetch-deps.sh

      # what the ddk actually put on disk for this KMI. the types in devtmpfs.c and
      # misc_ksym.h are taken from these headers with typeof(&symbol), so the two
      # lines that decide whether that works, and where the symbol version table
      # lives for the CRC check at the end, are printed here in the same run that
      # builds. every command ends in || true: a grep that finds nothing is an
      # answer, not a reason to kill the job
      - name: DDK facts
        run: |
          echo "KMI=${{ matrix.kmi }}"
          echo "KDIR=$KDIR"
          echo "--- kdir ---"; ls -l "$KDIR" 2>/dev/null || true
          echo "--- source ---"; readlink -f "$KDIR/source" || true; ls -l "$KDIR/source" 2>/dev/null | head -20 || true
          echo "--- device_get_devnode in drivers/base/base.h ---"
          grep -rn -A2 "device_get_devnode" "$KDIR/source/drivers/base/base.h" 2>/dev/null || true
          echo "--- device_get_devnode in include/linux/device.h ---"
          grep -rn -A2 "device_get_devnode" "$KDIR/source/include/linux/device.h" 2>/dev/null || true
          echo "--- the declarations misc_ksym.h leans on ---"
          for s in xt_register_matches inet_dev_addr_type ipv6_chk_addr __ipv6_addr_type proc_alloc_inum prepare_creds commit_creds key_put; do
            printf '%-24s ' "$s"
            grep -rhoE "[a-zA-Z_ ].*[^a-zA-Z_]$s\([^;]*;" \
              "$KDIR/source/include" "$KDIR/source/net" 2>/dev/null | head -1 || true
            echo
          done
          echo "--- Module.symvers ---"
          ls -l "$KDIR/Module.symvers" 2>/dev/null && wc -l < "$KDIR/Module.symvers" || echo "absent"
          echo "--- vmlinux (informational, nothing depends on it) ---"
          ls -l "$KDIR/vmlinux" 2>/dev/null || true

      - name: Build ${{ matrix.kmi }}
        run: |
          make VER=${{ matrix.kmi }} > build.log 2>&1 || { tail -50 build.log; exit 1; }
          tail -5 build.log

      # case insensitive, and it covers modpost's ERROR:/WARNING: too. the lowercase
      # form this used to match let every "undefined!" and every version mismatch
      # through, which is the one class of failure that only shows up on the device
      - name: Zero warning gate
        run: |
          if grep -niE "error:|warning:" build.log; then
            echo "build log is not clean"
            exit 1
          fi

      # the symbol version records the module carries, against the kernel's own
      # table, so a CRC that disagrees is caught here instead of at insmod
      - name: Module ABI check
        run: |
          KO=out/${{ matrix.kmi }}/droid_lkm.ko
          echo "--- vermagic ---"
          modinfo -F vermagic "$KO" || true
          : > mod-ver.txt
          if ! command -v modprobe >/dev/null 2>&1; then
            echo "no modprobe in this image, so the records cannot be dumped here."
            echo "modpost's own version check is what the zero warning gate covers."
            exit 0
          fi
          modprobe --dump-modversions "$KO" 2>/dev/null \
            | awk '{ c=$1; sub(/^0x/, "", c); print tolower(c), $2 }' \
            | sort > mod-ver.txt || true
          echo "--- versions the module carries: $(wc -l < mod-ver.txt) ---"
          if [ ! -s "$KDIR/Module.symvers" ]; then
            echo "the ddk carries no kernel Module.symvers, so modpost had no version"
            echo "table to check the module against. that is the finding, not a failure."
            exit 0
          fi
          awk '{ c=$1; sub(/^0x/, "", c); print tolower(c), $2 }' "$KDIR/Module.symvers" \
            | sort > kern-ver.txt
          fail=0
          while read -r crc sym; do
            want=$(awk -v s="$sym" '$2 == s { print $1; exit }' kern-ver.txt)
            if [ -z "$want" ]; then
              echo "MISSING from the kernel: $sym (module carries $crc)"
              fail=1
            elif [ "$want" != "$crc" ]; then
              echo "CRC MISMATCH: $sym module=$crc kernel=$want"
              fail=1
            fi
          done < mod-ver.txt
          if [ "$fail" = 0 ]; then
            echo "module ABI matches the kernel's Module.symvers"
          else
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-${{ matrix.kmi }}
          path: out/${{ matrix.kmi }}/droid_lkm.ko
          if-no-files-found: warn
