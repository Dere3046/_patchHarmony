name: Build GKI

on:
  push:
    paths:
      - 'src/**'
      - 'compat/**'
      - 'Makefile'
      - 'mk/**'
      - 'deps.lst'
      - 'scripts/fetch-deps.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      # one KMI failing must not cancel the rest: the first round of this
      # matrix reported one real failure and five cancels, which reads as
      # five builds that were never tried
      fail-fast: false
      matrix:
        kmi:
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps
        env:
          KMSDK_TOKEN: ${{ secrets.KMSDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${KMSDK_TOKEN}@github.com/".insteadOf "git@github.com:"
          scripts/fetch-deps.sh

      - name: Prototype probe
        run: |
          H="$KDIR/source/include"
          echo "KMI=${{ matrix.kmi }}"
          for s in device_get_devnode vfs_kern_mount kern_unmount vfs_mknod vfs_mkdir notify_change vfs_unlink vfs_rmdir vfs_getattr register_filesystem unregister_filesystem reconfigure_single deactivate_locked_super shmem_init_fs_context kill_litter_super lookup_one_len dget_parent create_new_namespaces prepare_creds commit_creds key_put; do
            echo "===== $s ====="
            grep -rn --include=*.h -A4 "[^a-zA-Z_]$s(" "$H" 2>/dev/null | head -10 || true
          done
          for d in block_class devices_kset; do
            echo "===== data: $d ====="
            grep -rn --include=*.h -E "(extern )?(const )?struct [a-z_]+ +\*?$d(;|\[)" "$H" 2>/dev/null | head -4 || true
          done

      - name: Build ${{ matrix.kmi }}
        run: |
          make VER=${{ matrix.kmi }} > build.log 2>&1 || { tail -50 build.log; exit 1; }
          tail -5 build.log

      - name: Zero warning gate
        run: |
          if grep -nE "error:|warning:" build.log; then
            echo "build log is not clean"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-${{ matrix.kmi }}
          path: out/${{ matrix.kmi }}/droid_lkm.ko
          if-no-files-found: warn
