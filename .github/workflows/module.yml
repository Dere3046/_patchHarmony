name: Module zip
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps
        env:
          KMSDK_TOKEN: ${{ secrets.KMSDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${KMSDK_TOKEN}@github.com/".insteadOf "git@github.com:"
          scripts/fetch-deps.sh

      - name: Build ${{ matrix.kmi }}
        run: |
          make VER=${{ matrix.kmi }} > build.log 2>&1 || { tail -50 build.log; exit 1; }
          tail -5 build.log

      - name: Zero warning gate
        run: |
          if grep -nE "error:|warning:" build.log; then
            echo "build log is not clean"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-${{ matrix.kmi }}
          path: |
            out/${{ matrix.kmi }}/droid_lkm.ko
            out/${{ matrix.kmi }}/droid_lkm_vendor.ko
          if-no-files-found: warn

  package:
    needs: build
    
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Collect ko
        run: |
          mkdir -p out
          for d in art/*/; do
            k=${d%/}; k=${k##*/droid_lkm-}
            [ -f "$d/droid_lkm.ko" ] || { echo "skip $k: no droid_lkm.ko"; continue; }
            mkdir -p "out/$k"
            cp "$d"/*.ko "out/$k/"
            echo "$k: $(ls "out/$k" | tr '\n' ' ')"
          done
          if [ -z "$(ls -A out)" ]; then
            echo "no ko collected, nothing to package"
            exit 1
          fi

      - name: Package
        run: |
          chmod +x scripts/*.sh
          sh scripts/package-module.sh
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: phDroid-module
          path: dist/*.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
          generate_release_notes: true
