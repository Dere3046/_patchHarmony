name: Module zip
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, native, both]
        target:
          - { kmi: android12-5.10, image: android12-5.10-20260313 }
          - { kmi: android13-5.10, image: android13-5.10-20260313 }
          - { kmi: android13-5.15, image: android13-5.15-20260313 }
          - { kmi: android14-5.15, image: android14-5.15-20260313 }
          - { kmi: android14-6.1, image: android14-6.1-20260313 }
          - { kmi: android15-6.6, image: android15-6.6-20260313 }
          - { kmi: android16-6.12, image: android16-6.12-20260313 }
          - { kmi: android17-6.18, image: android17-6.18-20260828 }
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.target.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps
        env:
          KMSDK_TOKEN: ${{ secrets.KMSDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${KMSDK_TOKEN}@github.com/".insteadOf "git@github.com:"
          scripts/fetch-deps.sh

      - name: Build ${{ matrix.variant }} ${{ matrix.target.kmi }}
        run: |
          extra=""
          if [ "${{ matrix.variant }}" = "native" ]; then
            extra="DROID_LKM_NATIVE_PID=1"
          elif [ "${{ matrix.variant }}" = "both" ]; then
            extra="DROID_LKM_PID_BOTH=1"
          fi
          make VER=${{ matrix.target.kmi }} $extra > build.log 2>&1 || { tail -50 build.log; exit 1; }
          tail -5 build.log

      - name: Zero warning gate
        run: |
          if grep -nE "error:|warning:" build.log; then
            echo "build log is not clean"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-${{ matrix.variant }}-${{ matrix.target.kmi }}
          path: |
            out/${{ matrix.target.kmi }}/droid_lkm.ko
            out/${{ matrix.target.kmi }}/droid_lkm_vendor.ko
          if-no-files-found: warn

  package:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build webui flavors
        run: |
          if [ -f webui/package.json ]; then
            npm --prefix webui ci
            for fl in standard native main-native; do
              VITE_PHDROID_FLAVOR="$fl" VITE_OUT_DIR="dist-$fl" npm --prefix webui run build
            done
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Collect ko
        run: |
          collect_variant() {
            local var=$1
            local dst=$2
            local d k
            mkdir -p "$dst"
            for d in art/droid_lkm-"$var"-*/; do
              [ -d "$d" ] || continue
              k=${d%/}; k=${k##*/droid_lkm-"$var"-}
              [ -f "$d/droid_lkm.ko" ] || { echo "skip $var/$k: no droid_lkm.ko"; continue; }
              mkdir -p "$dst/$k"
              cp "$d"/*.ko "$dst/$k/"
              echo "$var/$k: $(ls "$dst/$k" | tr '\n' ' ')"
            done
          }
          collect_variant standard out
          collect_variant native out-native
          collect_variant both out-both
          if [ -z "$(ls -A out)" ] && [ -z "$(ls -A out-native)" ] && [ -z "$(ls -A out-both)" ]; then
            echo "no ko collected, nothing to package"
            exit 1
          fi

      - name: Package all flavors
        run: |
          args=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args="-Pversion=$GITHUB_REF_NAME"
          fi
          gradle --no-daemon packageAllFlavors $args
          ls -lh build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: phDroid-modules
          path: build/dist/*.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/dist/*.zip
          generate_release_notes: true
