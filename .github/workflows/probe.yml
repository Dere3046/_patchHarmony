name: Probe

# diagnostic only: resolves the exact per-KMI prototype of the kernel symbols
# this module reaches through function pointers. deleted again once the
# prototypes in devtmpfs.c and misc_ksym.h are written out against it.
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - name: Probe
        run: |
          S="$KDIR/source"
          R="$S/include $S/kernel $S/net $S/fs $S/drivers $S/security $S/ipc"
          echo "KMI=${{ matrix.kmi }}"
          probe() {
            s="$1"
            echo "===== $s ====="
            grep -rn --include=*.h -A6 -E "(^|[^a-zA-Z_])$s[ 	]*\(" $R 2>/dev/null \
              | grep -v -E '^[^:]+[:-][0-9]+[-:][ 	]*(\*|/\*)' \
              | head -14 || true
          }
          for s in device_get_devnode notify_change vfs_mknod vfs_mkdir vfs_unlink vfs_rmdir ipv6_chk_addr; do
            probe "$s"
          done
          echo "===== create_new_namespaces (any file) ====="
          grep -rn --include=*.h --include=*.c -E "(^|[^a-zA-Z_])create_new_namespaces[ 	]*\(" \
            "$S/include" "$S/kernel" 2>/dev/null | head -8 || true
          echo "===== data: block_class ====="
          grep -rn --include=*.h -E "(extern )?(const )?struct class block_class(;|\[)" $R 2>/dev/null | head -4 || true
          echo "===== data: nop_mnt_idmap ====="
          grep -rn --include=*.h -E "extern struct mnt_idmap nop_mnt_idmap" $R 2>/dev/null | head -2 || true
